name: Build release artifacts

on:
  workflow_dispatch:
    inputs:
      upload-artifacts:
        type: string
        default: 'NO'
      artifacts-retention-days:
        type: number
        default: 1
      publish:
        type: string
        default: 'NO'
      target:
        type: string
        description: 'The target package to build'
        default: '*'
  workflow_call:
    inputs:
      upload-artifacts:
        type: string
        default: 'YES'
      artifacts-retention-days:
        type: number
        default: 3
      publish:
        type: string
        default: 'NO'
    secrets:
      NPM_TOKEN:
        required: true

env:
  HEXAGON_SDK_VERSION: '6.7.0.0'
  OPENCL_VERSION: '2025.07.22'
  EMSCRIPTEN_IMAGE: 'emscripten/emsdk:4.0.13'
  # ggml wraps the compilers in ccache where it finds one. No cache is kept
  # between runs here, so that would only add a preprocessor run per file.
  CCACHE_DISABLE: '1'

jobs:
  build:
    name: build (${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        include:
          # Linux x86_64 default
          - os: ubuntu-22.04
            arch: x86_64
            container: ''
            target: default
            package: node-llama-linux-x64
          # Linux x86_64 Vulkan
          - os: ubuntu-22.04
            arch: x86_64
            target: vulkan
            package: node-llama-linux-x64-vulkan
          # Linux arm64 default
          - os: ubuntu-22.04-arm
            arch: arm64
            target: default
            package: node-llama-linux-arm64
          # Linux arm64 Vulkan
          - os: ubuntu-22.04-arm
            arch: arm64
            target: vulkan
            package: node-llama-linux-arm64-vulkan
          # macOS x64
          - os: macos-15-intel
            arch: x64
            target: default
            package: node-llama-darwin-x64
          # macOS arm64
          - os: macos-26
            arch: arm64
            target: default
            package: node-llama-darwin-arm64
          # Windows x64 default
          - os: windows-latest
            arch: x64
            target: default
            package: node-llama-win32-x64
            toolchain: clang-cl
          # Windows x64 Vulkan
          - os: windows-latest
            arch: x64
            target: vulkan
            package: node-llama-win32-x64-vulkan
            toolchain: mingw-clang
          # Windows arm64 default
          - os: windows-latest
            arch: arm64
            target: default
            package: node-llama-win32-arm64
            toolchain: mingw-clang
          # Windows arm64 Vulkan
          - os: windows-latest
            arch: arm64
            target: vulkan
            package: node-llama-win32-arm64-vulkan
            toolchain: mingw-clang
          # Linux arm64 Snapdragon (cross-compiled on x86_64)
          - os: ubuntu-24.04
            arch: arm64
            target: snapdragon
            package: node-llama-linux-arm64-snapdragon
            cross-compile: true
          # TODO: uncomment this when Windows arm64 Snapdragon is supported
          # # Windows arm64 Snapdragon
          # - os: windows-latest
          #   arch: arm64
          #   target: snapdragon
          #   package: node-llama-win32-arm64-snapdragon
          #   toolchain: mingw-clang
    # Shared by the CUDA jobs below, which add `matrix.cuda-shard` (compile one
    # slice of the CUDA kernels and upload the objects) or `matrix.cuda-objects`
    # (build the package from the downloaded objects)
    steps: &native-steps
      - name: Run this job?
        id: run
        env:
          TRIGGER_TARGET: node-llama-${{ github.event.inputs.target || '*' }}
          TARGET: ${{ matrix.package }}
        shell: bash
        run: |
          if [[ "$TARGET" == $TRIGGER_TARGET ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
          fi
      - name: Upgrade git
        if: steps.run.outputs.should-run == 'true' && matrix.need-fix-git == 'true'
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v4
        if: steps.run.outputs.should-run == 'true'
        with:
          submodules: 'true'
      - uses: actions/setup-node@v4
        if: steps.run.outputs.should-run == 'true'
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Install CUDA
        if: steps.run.outputs.should-run == 'true' && matrix.target == 'cuda' && matrix.cuda-version
        uses: ./.github/actions/setup-cuda
        with:
          version: ${{ matrix.cuda-version }}
      - name: Install dependencies
        if: steps.run.outputs.should-run == 'true'
        run: |
          npm install -g npm@latest
          npm install --omit=optional
      - name: Install Vulkan SDK
        if: steps.run.outputs.should-run == 'true' && matrix.target == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@v1.2.4
        with:
          vulkan_version: '1.4.313.0'
          install_runtime: true
          optional_components: com.lunarg.vulkan.arm64
          cache: true
          stripdown: true
      - name: Select Xcode 26.2 (macOS arm64)
        if: steps.run.outputs.should-run == 'true' && runner.os == 'macOS' && matrix.arch == 'arm64'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Xcode version
        if: steps.run.outputs.should-run == 'true' && runner.os == 'macOS' && matrix.arch == 'arm64'
        run: xcodebuild -version
      - name: Download CUDA objects
        if: steps.run.outputs.should-run == 'true' && matrix.cuda-objects
        uses: actions/download-artifact@v4
        with:
          pattern: cuda-objects-${{ matrix.package }}-*
          path: ${{ matrix.cuda-objects }}
          merge-multiple: true
      - name: Prepare & build (Linux)
        if: steps.run.outputs.should-run == 'true' && runner.os == 'Linux'
        env:
          CUDA_SHARD: ${{ matrix.cuda-shard }}
          CUDA_OBJECTS: ${{ matrix.cuda-objects }}
        run: |
          bash ./scripts/prepare-linux.sh -a ${{ matrix.arch }} -t ${{ matrix.target }}
          bash ./scripts/build-linux.sh -a ${{ matrix.arch }} -t ${{ matrix.target }}
      - name: Prepare & build (macOS)
        if: steps.run.outputs.should-run == 'true' && runner.os == 'macOS'
        run: |
          bash ./scripts/build-macos.sh
      - name: Prepare & build (Windows)
        if: steps.run.outputs.should-run == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          CUDA_SHARD: ${{ matrix.cuda-shard }}
          CUDA_OBJECTS: ${{ matrix.cuda-objects }}
        run: |
          $ErrorActionPreference='Stop'
          . ./scripts/prepare-windows.ps1 -arch ${{ matrix.arch }} -target ${{ matrix.target }} -toolchain ${{ matrix.toolchain }}
          pwsh ./scripts/build-windows.ps1 -arch ${{ matrix.arch }} -target ${{ matrix.target }} -toolchain ${{ matrix.toolchain }}
      - name: Upload CUDA objects
        if: steps.run.outputs.should-run == 'true' && matrix.cuda-shard
        uses: actions/upload-artifact@v4
        with:
          name: cuda-objects-${{ matrix.package }}-${{ strategy.job-index }}
          path: build/cuda-objects
          if-no-files-found: error
          # only for the job that links them; the kernels in them are compressed already
          retention-days: 1
          compression-level: 1
      - name: Upload build artifacts
        if: steps.run.outputs.should-run == 'true' && !matrix.cuda-shard && (github.event.inputs.upload-artifacts == 'YES' || inputs.upload-artifacts == 'YES')
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.package }}
          path: packages/${{ matrix.package }}
          retention-days: ${{ inputs.artifacts-retention-days }}
      - name: Publish to NPM
        if: steps.run.outputs.should-run == 'true' && !matrix.cuda-shard && (github.event.inputs.publish == 'YES' || inputs.publish == 'YES')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run publish-if-need packages/${{ matrix.package }}

  # The CUDA kernels (ggml-cuda) are ~150 nvcc translation units that are each
  # compiled once per GPU architecture: about one core-hour per architecture and
  # nearly all of a CUDA build. `cuda-objects-*` compile them in slices on
  # several runners, `build-cuda-*` build the rest and link the package from the
  # objects of every slice (cmake/cuda-shards.cmake).
  #
  # To change the number of slices, edit the `cuda-shard` list of a job; to build
  # a variant on one runner again, move it back to the matrix of `build`.
  cuda-objects-linux:
    name: cuda-objects (${{ matrix.package }}, ${{ matrix.cuda-shard }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        package: &cuda-packages-linux
          - node-llama-linux-x64-cuda
          - node-llama-linux-arm64-cuda
        cuda-shard: ['1/3', '2/3', '3/3']
        include: &cuda-variants-linux
          # Linux x86_64 CUDA
          - package: node-llama-linux-x64-cuda
            os: ubuntu-22.04
            arch: x86_64
            container: nvidia/cuda:12.6.2-devel-ubuntu22.04
            target: cuda
            need-fix-git: 'true'
          # Linux arm64 CUDA
          - package: node-llama-linux-arm64-cuda
            os: ubuntu-22.04-arm
            arch: arm64
            container: nvidia/cuda:12.6.2-devel-ubuntu22.04
            target: cuda
            need-fix-git: 'true'
    steps: *native-steps

  build-cuda-linux:
    name: build (${{ matrix.package }})
    needs: cuda-objects-linux
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        package: *cuda-packages-linux
        cuda-objects: [cuda-objects]
        include: *cuda-variants-linux
    steps: *native-steps

  cuda-objects-windows:
    name: cuda-objects (${{ matrix.package }}, ${{ matrix.cuda-shard }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        package: &cuda-packages-windows
          - node-llama-win32-x64-cuda
        # Three GPU architectures here, against one in the Linux builds
        cuda-shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8']
        include: &cuda-variants-windows
          # Windows x64 CUDA
          # CUDA 12.x does not support the MSVC of the Windows 2025 VS 2026
          # image currently behind windows-latest.
          - package: node-llama-win32-x64-cuda
            os: windows-2022
            arch: x64
            target: cuda
            toolchain: cl
            cuda-version: '12.9.1'
    steps: *native-steps

  build-cuda-windows:
    name: build (${{ matrix.package }})
    needs: cuda-objects-windows
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        package: *cuda-packages-windows
        cuda-objects: [cuda-objects]
        include: *cuda-variants-windows
    steps: *native-steps

  # One job per WASM artifact, they are full builds that share nothing
  build-wasm:
    name: build-wasm (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: cpu
            flags: --no-webgpu --no-threads
          - variant: cpu-threads
            flags: --no-webgpu --threads
          - variant: webgpu
            flags: --webgpu --no-threads
    steps:
      - name: Run this job?
        id: run
        env:
          TRIGGER_TARGET: node-llama-${{ github.event.inputs.target || '*' }}
          TARGET: node-llama-wasm
        shell: bash
        run: |
          if [[ "$TARGET" == $TRIGGER_TARGET ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
        if: steps.run.outputs.should-run == 'true'
        with:
          submodules: 'true'
      - name: Build WASM artifact
        if: steps.run.outputs.should-run == 'true'
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          docker run --rm \
            -e HOME=/tmp \
            -e EMDAWN_TAG \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$PWD:/src" \
            -w /src \
            "$EMSCRIPTEN_IMAGE" \
            bash -lc "source /emsdk/emsdk_env.sh && node scripts/build-wasm-package.js $FLAGS && chown -R \$HOST_UID:\$HOST_GID build-wasm packages/node-llama-wasm/wasm"
      - name: Upload WASM artifact
        if: steps.run.outputs.should-run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.variant }}
          path: packages/node-llama-wasm/wasm
          if-no-files-found: error
          # only for the package-wasm job
          retention-days: 1

  package-wasm:
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - name: Run this job?
        id: run
        env:
          TRIGGER_TARGET: node-llama-${{ github.event.inputs.target || '*' }}
          TARGET: node-llama-wasm
        shell: bash
        run: |
          if [[ "$TARGET" == $TRIGGER_TARGET ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
        if: steps.run.outputs.should-run == 'true'
      - uses: actions/setup-node@v4
        if: steps.run.outputs.should-run == 'true'
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Download WASM artifacts
        if: steps.run.outputs.should-run == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: wasm-*
          path: packages/node-llama-wasm/wasm
          merge-multiple: true
      - name: Check WASM artifacts
        if: steps.run.outputs.should-run == 'true'
        working-directory: packages/node-llama-wasm
        run: |
          ls -l wasm
          for file in $(node -p "require('./package.json').files.filter((file) => file.startsWith('wasm/')).join(' ')"); do
            test -s "$file" || { echo "::error::$file is missing from the WASM builds"; exit 1; }
          done
      - name: Upload build artifacts
        if: steps.run.outputs.should-run == 'true' && (github.event.inputs.upload-artifacts == 'YES' || inputs.upload-artifacts == 'YES')
        uses: actions/upload-artifact@v4
        with:
          name: bin-node-llama-wasm
          path: packages/node-llama-wasm
          retention-days: ${{ inputs.artifacts-retention-days }}
      - name: Publish to NPM
        if: steps.run.outputs.should-run == 'true' && (github.event.inputs.publish == 'YES' || inputs.publish == 'YES')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run publish-if-need packages/node-llama-wasm
